# main へのマージ（push）で、テストとビルドをしてから GitHub Pages にデプロイする
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# デプロイは同時に1つだけ。途中のデプロイは止めずに最後まで終わらせる
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: テストとビルド
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
      # itch.io にアップロードする zip を作り、Pages の /sairei-itch.zip からダウンロードできるようにする
      - run: npm run zip:itch

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: デプロイ
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
