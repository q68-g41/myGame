<!doctype html>
<!--
  itch.io のカバー画像（630×500）を作るためのページ。
  ブラウザで開いて .cover の部分を 630×500 で画像にする（docs/itch.md の「カバー画像の作り直し」）。
  絵はリポジトリのドット絵をそのまま読む。タイトルが決まったら、h1 を書き換えて作り直す。
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<title>カバー画像</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  .cover {
    position: relative; width: 630px; height: 500px; overflow: hidden;
    background: radial-gradient(120% 90% at 50% 0%, #2a2840 0%, #16151f 60%, #0f0e16 100%);
    color: #f2f2f7; font-family: 'Zen Kaku Gothic New', sans-serif;
  }
  /* 上の帯：6つの属性の色 */
  .bands { position: absolute; inset: 0 0 auto 0; height: 10px; display: flex; }
  .bands span { flex: 1; }
  .glow { position: absolute; border-radius: 50%; filter: blur(40px); opacity: 0.28; }
  .title { position: absolute; left: 0; right: 0; top: 78px; text-align: center; }
  .title h1 {
    margin: 0; font-family: 'DotGothic16', sans-serif; font-weight: 400; font-size: 80px; letter-spacing: 0.08em;
    text-shadow: 0 2px 0 #0008, 0 0 24px #0006;
  }
  .title p { margin: 14px 0 0; font-size: 19px; font-weight: 700; letter-spacing: 0.08em; color: #e9e4d6; }
  .row { position: absolute; left: 0; right: 0; bottom: 52px; display: flex; justify-content: center; gap: 6px; }
  /* ドット絵は2倍（整数倍）で、後ろに属性の色をうすく敷く（ゲームのバトル画面と同じ） */
  .sp {
    width: 100px; height: 100px; display: grid; place-items: center; border-radius: 50%;
    background: radial-gradient(circle at 50% 58%, color-mix(in srgb, var(--c) 45%, transparent) 0 44%, transparent 70%);
  }
  .sp img { display: block; image-rendering: pixelated; }
  /* 彩り手（64×64 を2倍）と、その相棒（48×48 を2倍）を並べる。足もとをそろえ、後ろに属性の色をうすく敷く */
  .pair {
    display: flex; align-items: flex-end; width: 200px; height: 136px; padding-bottom: 4px;
    background: radial-gradient(closest-side at 50% 62%, color-mix(in srgb, var(--c) 48%, transparent) 0%, transparent 100%);
  }
  .pair img { display: block; image-rendering: pixelated; }
  .pair .aibo { margin-left: -24px; margin-bottom: -2px; }
  .tag { position: absolute; left: 0; right: 0; bottom: 22px; text-align: center; font-family: 'DotGothic16', sans-serif; font-size: 16px; font-weight: 400; color: #c9c6d6; letter-spacing: 0.06em; }
  .tag b { color: #f0b445; font-weight: 400; }
</style>
</head>
<body>
<div class="cover">
  <div class="bands"><span style="background: #d9473f"></span><span style="background: #e8873a"></span><span style="background: #e3c23d"></span><span style="background: #4fb36a"></span><span style="background: #3f8fd9"></span><span style="background: #9a6ad9"></span></div>
  <div class="glow" style="left: -60px; top: 120px; width: 260px; height: 200px; background: #d9473f"></div>
  <div class="glow" style="right: -60px; top: 110px; width: 260px; height: 200px; background: #3f8fd9"></div>
  <div class="glow" style="left: 220px; top: 300px; width: 200px; height: 140px; background: #4fb36a"></div>
  <div class="title">
    <h1>彩霊のみち</h1>
    <p>相手の一手を読む、ローグライト・コマンドバトル</p>
  </div>
  <div class="row">
    <div class="pair" style="--c: #d9473f"><img class="hito" src="../../src/assets/irodorite/hina.png" width="128" height="128" alt=""><img class="aibo" src="../../src/assets/sprites/hina-partner.png" width="96" height="96" alt=""></div>
    <div class="pair" style="--c: #4fb36a"><img class="hito" src="../../src/assets/irodorite/yuhi.png" width="128" height="128" alt=""><img class="aibo" src="../../src/assets/sprites/yuhi-partner.png" width="96" height="96" alt=""></div>
    <div class="pair" style="--c: #3f8fd9"><img class="hito" src="../../src/assets/irodorite/rin.png" width="128" height="128" alt=""><img class="aibo" src="../../src/assets/sprites/rin-partner.png" width="96" height="96" alt=""></div>
  </div>
  <div class="tag"><b>縦持ち・片手</b>　1回15〜20分　ブラウザで遊べる</div>
</div>
</body>
</html>
